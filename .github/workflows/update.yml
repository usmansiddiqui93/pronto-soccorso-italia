name: Update data and deploy map

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay scheduled runs by a few minutes)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Start from the currently published data, so a source that fails this run keeps its last good values.
      - name: Download previous data
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data/latest.json" -o docs/data/latest.json || echo "No previous data yet"

      - name: Fetch sources
        run: npm run update

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
